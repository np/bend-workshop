<script>
// The fonts come from Google Fonts unless the person turned that off in
// Settings: it is the one request this page makes of its own. Off, nothing
// is asked for and the system's own fonts are used.
(function () {
  var CSS = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap";
  window.bendFonts = function (on) {
    var ids = ["gf-pre1", "gf-pre2", "gf-css"];
    ids.forEach(function (id) {
      var n = document.getElementById(id);
      if (n) {
        n.remove();
      }
    });
    if (!on) {
      return;
    }
    var add = function (id, rel, href, cross) {
      var l = document.createElement("link");
      l.id = id;
      l.rel = rel;
      l.href = href;
      if (cross) {
        l.crossOrigin = "anonymous";
      }
      document.head.appendChild(l);
    };
    add("gf-pre1", "preconnect", "https://fonts.googleapis.com");
    add("gf-pre2", "preconnect", "https://fonts.gstatic.com", true);
    add("gf-css", "stylesheet", CSS);
  };
  var on = true;
  try {
    var m = JSON.parse(window.localStorage.getItem("bend-play:v2") || "null");
    on = !(m && m.fonts === false);
  } catch (e) {}
  window.bendFonts(on);
})();
</script>

<template id="about-en">
  <div class="about">
    <p>A pocket workshop for <a href="https://bend-lang.com" target="_blank" rel="noopener">Bend 2</a>:
    Bend's own checker and compilers (<code>bend.ts</code>, <code>comp.ts</code>, <code>safe.ts</code>,
    version __VERSION__, commit <code>__COMMIT__</code>) run here, in the browser, with no server. Code
    is checked as you type, compiled to JavaScript, and run in a worker.</p>
    <p>The JavaScript lane runs on one core: parallel calls and <code>!</code> run in sequence. A
    <code>Window</code> opens in the Screen tab, with keyboard, pointer, and an on-screen pad on a
    phone. Audio, files and sockets are not available. A <code>.js</code> file in the workspace serves
    as a foreign effect.</p>
    <p>Every <code>?name</code> hole has a card under the editor: its context, then its goal, laid out
    to fit. From a card: "Constructors" tries each term the goal's type is built with, and "Solve"
    puts in the only one that fits; "Split" writes one match on the variables you tick; "Lemma" turns
    the goal into a def of its own; a <code>#goal:</code> line shows the goal at that point of a
    proof. The bar under the editor follows the caret: the signature of the call or the operator at
    hand, and from it, going to a definition, splitting a typed def into a law and a def, or writing
    operators as calls and back. Every one of these edits is checked before it is written.</p>
    <p>The "Compiled" tab shows what <code>bend -o</code> would write for the open file: JavaScript, a
    JS module, C, or BendTT, the input of <code>--verdict</code>'s kernel. It builds only the target
    shown, only while the tab is open.</p>
    <p>An assistant, set up in Settings as named profiles (Claude through claude.ai, a vendor's API,
    or any OpenAI-shaped server, a local one included), can answer about a goal, an error or a
    declaration. As an agent, it changes the project through tools: files can be locked, and a
    session on chosen holes can only fill them. Each of its writes is checked at once; a snapshot
    comes first, and one tap undoes the session. Its whole conversation can be followed, kept, and
    exported.</p>
    <p>Modules imported from the hub open as read-only tabs. The page keeps the hub's files it
    fetched; where it cannot reach the hub (claude.ai's viewer), run the file once with the bend CLI
    and import a zip of ~/.bend/lib.</p>
    <p>Work is kept as projects, in this browser only, with snapshots to go back to, and exports as
    a zip that <code>bend main.bend</code> runs once unzipped.</p>
    <p>The verdict follows the CLI's: ALL PROOFS CHECK when no def relies on unsafe or foreign code.
    <code>--verdict</code> rechecks a file with BendTT, a minimal kernel proven in Lean, which runs
    only on a machine. There is a $10k bounty for a file that passes it yet proves Empty: see the
    examples.</p>
    <p>Privacy: no telemetry. The one request the page makes of its own is for its fonts, from Google
    Fonts, which Settings turns off. Anything else goes out only when you ask for it.</p>
    <p>The interface is in English, French or Portuguese (Settings); the guide is Bend's own, in
    English.</p>
    <p>Bend, its Base library, its guide and the demos used in the examples are © 2026
    HigherOrderCO, under the Apache 2.0 license:
    <a href="https://github.com/bendlang/bend" target="_blank" rel="noopener">github.com/bendlang/bend</a>.
    This page is not an official Bend product.</p>
  </div>
</template>
